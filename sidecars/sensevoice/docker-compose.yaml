name: sensevoice-sidecar

services:
  sensevoice:
    container_name: sensevoice-sidecar
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODELSCOPE_CACHE: /models
      SENSEVOICE_DEVICE: ${SENSEVOICE_DEVICE:-auto}
      SENSEVOICE_MODEL: ${SENSEVOICE_MODEL:-iic/SenseVoiceSmall}
    volumes:
      - sensevoice-models:/models
    ports:
      - "50000:50000"
    restart: on-failure:5
    logging:
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  sensevoice-models:
